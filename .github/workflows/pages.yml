# Builds the demo app (npm run build, which builds the framework demos first) and publishes it to GitHub Pages, on each
# push to main, or by hand from the Actions tab
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one that's partway through publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Its npm cache runs Node's own npm, which devEngines refuses: cached below instead, once npm is upgraded
          package-manager-cache: false
      # The npm package.json asks for (packageManager), as devEngines refuses an older one. Outside the repository, where
      # devEngines would refuse the npm doing the upgrade too.
      - run: npm install -g npm@12.2.1
        working-directory: ${{ runner.temp }}
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
