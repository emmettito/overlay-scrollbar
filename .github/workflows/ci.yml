# The checks every pull request has to pass, and main after each merge: the same ones as before committing, plus the
# package test, the browser specs and the static-page tests (README.md). Not the benchmark, which takes minutes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its checks still running. Each push to main is grouped on its own: GitHub keeps
# only one run waiting per group, so a run of quick merges would otherwise skip the commits in between.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:package

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:browser
      - run: npm run test:static

  # The browser specs again on the other platforms, each in the browser closest to its own: WebKit on macOS, whose
  # scrollbars and scrolling are much closer to Safari's than Linux's WebKit, and Chromium on Windows, with classic
  # scrollbars that take up space
  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install ${{ matrix.browser }}
      - run: npm run test:browser -- --project ${{ matrix.browser }}
