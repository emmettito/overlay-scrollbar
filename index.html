<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>overlay-scrollbar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' font-size='80' text-anchor='middle' dominant-baseline='central'>↕️</text></svg>"
    />
    <script>
      // The theme before the page draws, so it doesn't flash: the visitor's choice (see src/theme.ts), or the system's
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <!-- On narrow screens only: the nav slides out from the menu button (src/menu.ts) -->
    <header class="topbar">
      <button type="button" class="menu-button" aria-label="Menu" aria-controls="nav" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <span class="topbar-title">overlay-scrollbar</span>
    </header>
    <div class="nav-backdrop"></div>
    <nav id="nav">
      <!-- Scrolls on a short screen, with the library's bars (src/main.ts). Inside the nav, so its bars slide out with it
           on narrow screens. -->
      <div class="nav-links">
        <a href="#/">Home</a>
        <h2>Demos</h2>
        <a href="#/list">List</a>
        <a href="#/table">Table</a>
        <a href="#/changing-content">Changing content</a>
        <a href="#/nested">Nested scroll areas</a>
        <a href="#/dialog">Dialog</a>
        <a href="#/rtl">Right-to-left</a>
        <a href="#/vertical">Vertical text</a>
        <a href="#/virtual">Virtual scrolling</a>
        <a href="#/drag-drop">Drag and drop</a>
        <a href="#/styling">Styling</a>
        <h2>Frameworks</h2>
        <a href="#/angular">Angular</a>
        <a href="#/react">React</a>
        <a href="#/vue">Vue</a>
        <a href="#/svelte">Svelte</a>
      </div>
      <button type="button" class="theme-toggle" role="switch" aria-checked="false">
        Dark theme<span class="switch" aria-hidden="true"></span>
      </button>
    </nav>
    <main></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
