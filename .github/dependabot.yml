# Opens weekly update PRs for releases at least 7 days old. Security updates skip the cooldown.
# dependabot-auto-merge.yml decides which PRs merge alone.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Without esbuild, whose minor versions wait for a review: it's still on 0.x, where they can break things
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [esbuild]
    ignore:
      # The types follow the Node version CI runs on, see actions/setup/action.yml
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
